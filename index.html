<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Моя коллекция</title>
        <link rel="stylesheet" href="styles.css" />
        
    </head>
    <body>
        <header class="header">
            <h1>Моя коллекция</h1>
        </header>

        <main class="container">
            <p id="status" class="status">Загрузка...</p>

            <div id="cards" class="cards">
                <article class="card">
                    <img
                        class="card__image"
                        src="https://via.placeholder.com/300x200"
                        alt="Интерьер" />
                    <div class="card__body">
                        <h2 class="card__title">ул. Леннина, 12</h2>
                        <p class="card__text">
                            Материал: кирпич<br>
                            Этажей: 5<br>
                            Площадь: 7,800 кв.м
                        </p>
                        <div class="card__footer">
                            <span class="card__year">Год: 1985</span>
                        </div>
                    </div>
                </article>
            </div>
        </main>
        <script src="scripts.js"></script>
    </body>
</html>
